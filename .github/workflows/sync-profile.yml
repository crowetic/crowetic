name: Sync public profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *' # approximately twice daily; GitHub may delay scheduled jobs
  push:
    branches: [main]
    paths:
      - 'scripts/sync_profile.py'
      - 'README.md'
      - '.github/workflows/sync-profile.yml'

permissions:
  contents: write

concurrency:
  group: crowetic-profile-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Gitea and GitHub public activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_profile.py
      - name: Commit refreshed public snapshot
        shell: bash
        run: |
          git add README.md assets/activity.svg data/sync-cache.json
          if ! git diff --cached --quiet; then
            git -c user.name='crowetic-profile-bot' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore: refresh public activity from GitHub and Gitea'
            git push
          fi
